name: Release

# 发布库只收运行文件：打 tag 即校验版本 → 生成来源证明 → 建 release。
# 构建不在这里跑；main.js / styles.css 由开发仓的 npm run build 产出后发布。
on:
    push:
        tags: ["*"]
    # 已经存在的 tag 需要补发时，手动触发并填 tag 名
    workflow_dispatch:
        inputs:
            tag:
                description: "要发布的 tag（须已存在，例如 1.3.1）"
                required: true

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        env:
            TAG: ${{ inputs.tag || github.ref_name }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.tag || github.ref_name }}

            - name: Check tag matches manifest version
              run: |
                  version="$(node -p "require('./manifest.json').version")"
                  if [ "$version" != "$TAG" ]; then
                    echo "::error::tag $TAG 与 manifest.json 的 version $version 不一致"
                    exit 1
                  fi

            - name: Attest build provenance
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      bin/exports/main.js
                      manifest.json
                      bin/exports/styles.css

            - name: Create release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$TAG" \
                    --title "$TAG" \
                    --generate-notes \
                    bin/exports/main.js manifest.json bin/exports/styles.css
